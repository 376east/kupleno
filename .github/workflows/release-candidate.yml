name: Build and publish release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify and package extension/next
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.verify.outputs.artifact }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/next/package-lock.json

      - name: Require successful CI for the tagged master commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/master; then
            echo "Release commit $commit must be in master history."
            exit 1
          fi
          ci_result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=push -f branch=master -f "head_sha=$commit" \
            --jq '.workflow_runs[0] | select(.event == "push" and .head_branch == "master" and .status == "completed") | [.head_sha, .conclusion] | @tsv')
          if [[ "$ci_result" != "$commit"$'\tsuccess' ]]; then
            echo "Release commit $commit requires successful master push CI."
            exit 1
          fi

      - name: Install locked build and test dependencies
        run: |
          npm ci
          npm --prefix extension/next ci

      - name: Install test Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the build and ZIP reproducibility
        id: verify
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            : "${EVENT_SHA:?Missing tag push SHA}"
            args=(--tag "$GITHUB_REF_NAME" --event-sha "$EVENT_SHA")
          fi
          python3 scripts/verify-next-release.py --output-dir dist/next-release "${args[@]}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            node scripts/release-notes.js "$GITHUB_REF_NAME" dist/next-release/release-notes.md --current
          fi
          printf 'artifact=kupleno-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          grep '^tag_object=' dist/next-release/provenance.txt >> "$GITHUB_OUTPUT"

      - name: Store verified archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.verify.outputs.artifact }}
          path: dist/next-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified GitHub release
    if: github.event_name == 'push'
    needs: candidate
    concurrency:
      group: publish-stable-release
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.candidate.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist

      - name: Publish GitHub release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.candidate.outputs.tag_object }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          grep -Fx "tag=$RELEASE_TAG" provenance.txt
          grep -Fx "tag_object=$TAG_OBJECT" provenance.txt
          commit=$(sed -n 's/^git_commit=//p' provenance.txt)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]

          check_release_refs() {
            local remote_tag remote_master merge_base
            remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            if [[ -z "$TAG_OBJECT" || "$remote_tag" != "$TAG_OBJECT" ]]; then
              echo "Release tag $RELEASE_TAG changed after verification." >&2
              return 1
            fi
            remote_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
            [[ "$remote_master" =~ ^[0-9a-f]{40}$ ]] || return 1
            merge_base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$remote_master?per_page=1" --jq .merge_base_commit.sha)
            if [[ "$merge_base" != "$commit" ]]; then
              echo "Release commit $commit is no longer in master history." >&2
              return 1
            fi
          }

          check_release_version() {
            local product_tags highest
            product_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
              .[] | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$"))
              | select(any(.assets[]; .name == "kupleno-extension.zip" and .state == "uploaded"))
              | .tag_name')
            highest=$(printf '%s\n' "$product_tags" | LC_ALL=C sort -V | tail -n 1)
            if [[ -n "$highest" ]] && ! printf '%s\n' "$highest" "$RELEASE_TAG" | LC_ALL=C sort -V -Cu; then
              echo "Release $RELEASE_TAG must be newer than public stable release $highest." >&2
              return 1
            fi
          }

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

          check_release_refs
          check_release_version
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --latest=false \
            --title "Куплено ${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            kupleno-extension.zip SHA256SUMS provenance.txt

          draft_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '
            if .isDraft and all(.assets[]; .state == "uploaded") then .assets[] | [.name, .digest] | @tsv
            else error("Expected a draft with uploaded assets") end' | LC_ALL=C sort)
          expected_assets=$(sha256sum kupleno-extension.zip SHA256SUMS provenance.txt | awk '{print $2 "\tsha256:" $1}' | LC_ALL=C sort)
          if [[ "$draft_assets" != "$expected_assets" ]]; then
            echo "The uploaded draft files do not match the verified release files." >&2
            exit 1
          fi

          check_release_refs
          check_release_version
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
